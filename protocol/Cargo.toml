[workspace]
members = ["core", "wire", "native-api", "client", "ffi", "cli", "android", "desktop", "desktop-config", "desktop-media", "desktop-ui", "policy", "traverse"]
# The desktop client needs SDL3 and FFmpeg; plain `cargo test` here stays the engine's.
default-members = ["core", "wire", "native-api", "client", "ffi", "cli", "android", "desktop-config", "desktop-ui", "policy", "traverse"]
exclude = ["vendor/sdl3-src"]
resolver = "3"

# SDL 3.4.20 with the Vulkan interop patch PyroWave GPU decoding shares the renderer's device
# through (vendor/sdl3-src/README.md). Only the Linux desktop client builds SDL from source.
[patch.crates-io]
sdl3-src = { path = "vendor/sdl3-src" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Set in protocol/.cargo/config.toml for aarch64 and checked in client/src/crypto.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aes_armv8)', 'cfg(polyval_armv8)'] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# The Android library has no unwinder; a panic aborts like a C assert would.
[profile.release]
panic = "abort"
opt-level = 3
lto = "thin"
codegen-units = 1

# Fast local debug APK profile (-PrustProfile=android-dev): optimized enough for smooth streaming
# without thin-LTO / single-CGU link times. Release APKs stay on [profile.release].
[profile.android-dev]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
debug = false

# Match root Cargo.toml: line tables keep file:line in panics for workspace crates while
# skipping full DWARF debug info for dependencies (shrinks client target dirs ~70% and speeds linking).
[profile.dev]
panic = "abort"
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# RSA key generation (client identities, test hosts) takes minutes unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
