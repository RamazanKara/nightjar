[package]
name = "nightjar-desktop"
description = "Nightjar for Windows and Linux: a Moonlight-protocol game-streaming client on nightjar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
# sdl3-sys needs 1.85.
rust-version = "1.85"
publish = false

[[bin]]
name = "nightjar"
path = "src/main.rs"

[dependencies]
nightjar-core = { path = "../client" }
nightjar-policy = { path = "../policy" }
rubylight-protocol = { path = "../core" }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }
mdns-sd = { version = "0.21", default-features = false }
# Each adapter's broadcast and IPv6 link for Wake-on-LAN; mdns-sd builds on the same version.
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
# The PyroWave SDK library is loaded at run time (stream/pyrowave_sdk.rs); ash only gives it the
# Vulkan types, so neither bindgen nor Vulkan headers are involved.
libloading = "0.8"
ash = { version = "0.38", default-features = false, features = ["std", "loaded"] }
# USB forwarding's device side; libusb is built in (vendored), so neither MSYS2 nor the distro needs it.
rusb = { version = "0.9", features = ["vendored"] }

# Windows links the SDL3 DLL found by pkg-config (MSYS2's mingw-w64-ucrt-x86_64-sdl3). Distros
# without an SDL3 package (Ubuntu 24.04) get SDL built from source and linked statically.
[target.'cfg(windows)'.dependencies]
sdl3-sys = { version = "0.7", default-features = false, features = ["use-pkg-config"] }
windows = { version = "0.62", features = ["Networking_Connectivity", "Win32_System_WinRT", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Wdk_Graphics_Direct3D", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties"] }

[target.'cfg(not(windows))'.dependencies]
sdl3-sys = { version = "0.7", default-features = false, features = ["build-from-source-static"] }
libc = "0.2"
zbus = { version = "5.19", default-features = false, features = ["tokio", "blocking-api"] }

[build-dependencies]
bindgen = "0.72"
# The Windows icon resource (build.rs); unused elsewhere.
embed-resource = "3.0.12"
pkg-config = "0.3"
