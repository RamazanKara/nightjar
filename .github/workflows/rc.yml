name: Release candidate

# Rubylight's main CI mirrors client/ here once Nightjar's checks passed there and sends the
# repository_dispatch event rc with the RC's version and this repo's commit
# (.github/workflows/nightjar-mirror.yml in RamazanKara/Rubylight). Rubylight and Nightjar share
# their version, so a commit's RC has the same version vX.Y.Z-rc.N in both: X.Y.Z is versionName,
# or the patch after it once that is released, and N counts the commits since the latest full
# release (.github/scripts/rc.mjs plan). The RC's text lists the commits since the previous
# release; without app changes (docs, notes, .github only) there is no RC. Its tag points at a
# commit outside main that only sets versionName to the RC's version, so the apps report it and
# release.yml's version checks hold. release.yml builds, signs and publishes it like any release.
# When commits land close together only the newest one's RC is built: an older event steps aside
# and a newer one cancels older RC builds. RCs stay until the next full release, which removes
# them. In-app updates never offer a prerelease. Full releases stay manual.

on:
  repository_dispatch:
    types: [rc]

permissions: {}

concurrency:
  group: nightjar-rc
  cancel-in-progress: false # never between the tag and its draft; older events step aside below

jobs:
  rc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the RC's commit, tag and draft release
      actions: write # starts release.yml
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.client_payload.sha }}
      VERSION: ${{ github.event.client_payload.version }}
    steps:
      # A newer mirror push sends its own event, which builds the RC instead.
      - id: newest
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+-rc[.][0-9]+$ ]] || { echo "::error::bad event: $SHA $VERSION"; exit 1; }
          newest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$newest" != "$SHA" ]; then
            echo "::notice::main moved on to $newest; its event builds the RC"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::notice::v$VERSION exists already"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.newest.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Release text
        id: notes
        if: steps.newest.outputs.skip != 'true'
        env:
          TAG: v${{ github.event.client_payload.version }}
          RC_PATHSPEC: . :!*.md :!docs :!fastlane :!store-assets :!.github :!LICENSE.txt
          RC_INTRO: >-
            Release candidate: a build of main for testing, not a full release. In-app updates
            don't offer it; install it by hand. The APK carries the release signature, so it
            installs over Nightjar.
        run: node .github/scripts/rc.mjs notes "$TAG" "$SHA" "$RUNNER_TEMP/notes.md"
      - id: commit
        if: steps.newest.outputs.skip != 'true' && steps.notes.outputs.commits != '0'
        run: node .github/scripts/rc.mjs version-commit "$SHA" "$VERSION"
      - name: Tag, draft the release and start release.yml
        if: steps.newest.outputs.skip != 'true' && steps.notes.outputs.commits != '0'
        env:
          TAG: v${{ github.event.client_payload.version }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          # Older RC builds still running are superseded by this one; prune drops their drafts.
          gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --limit 30 --json databaseId,headBranch,status --jq '.[] | select(.status != "completed" and (.headBranch | test("^v[0-9]+[.][0-9]+[.][0-9]+-rc[.][0-9]+$"))) | .databaseId' |
            while read -r run; do gh run cancel "$run" -R "$GITHUB_REPOSITORY" || true; done
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$COMMIT" > /dev/null
          if ! {
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
              --title "Nightjar $VERSION" --notes-file "$RUNNER_TEMP/notes.md" &&
            gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref "$TAG" -f dry_run=false
          }; then
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
              while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true; done
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true # no tag or draft without a started build
            exit 1
          fi
          echo "::notice::release.yml builds $TAG ($COMMIT, from $SHA)"
