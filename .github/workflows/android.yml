name: Android debug

on:
  push:
    branches: [main]
    # Docs, store listing and artwork sources don't change the APK.
    paths-ignore: ['**/*.md', 'docs/**', 'fastlane/**', 'store-assets/**', 'LICENSE.txt', '.github/ISSUE_TEMPLATE/**', '.github/scripts/**', '.github/workflows/issue-version-check.yml', '.github/*.yml']
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: Run the emulator smoke test and publish an arm64 debug APK as this prerelease tag
        type: string
        default: ''
      release_notes:
        description: Release notes for the pre-release (Markdown)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check generated settings and documentation links
        run: |
          python3 scripts/generate-settings.py
          git diff --exit-code -- docs/settings.md
          node --test scripts/check-doc-links.test.mjs scripts/build-release.test.mjs scripts/add-device-results.test.mjs scripts/device-docs.test.mjs scripts/device-results-issue.test.mjs
          node scripts/check-doc-links.mjs
          node scripts/device-docs.mjs --check
  desktop:
    # The Windows/Linux client: Linux build, unit tests and clippy (SDL3 is built from source).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test and lint the desktop client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build pkg-config libclang-dev \
            libavcodec-dev libavutil-dev libopus-dev libva-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl-dev libgl-dev libgles-dev libdrm-dev libgbm-dev libpulse-dev \
            libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libdecor-0-dev
          cd protocol
          cargo clippy -p nightjar-desktop --all-targets --locked -- -D warnings
          cargo test -p nightjar-desktop --locked
  build:
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # only the pre-release step uses the token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and rebuild the shipped Rust protocol
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          sudo apt-get update -qq
          sudo apt-get install -y llvm libssl-dev
          bash protocol/build-android.sh
      - name: Configure a disposable signing key for minified build validation
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/validation.p12" -storetype PKCS12 \
            -alias validation -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=Nightjar CI validation' -storepass validation -keypass validation
          echo "BP_KEYSTORE=$RUNNER_TEMP/validation.p12" >> "$GITHUB_ENV"
          echo 'BP_KEYSTORE_PASSWORD=validation' >> "$GITHUB_ENV"
          echo 'BP_KEY_ALIAS=validation' >> "$GITHUB_ENV"
          echo 'BP_KEY_PASSWORD=validation' >> "$GITHUB_ENV"
      - name: Build both flavors, lint and run unit tests
        run: >-
          bash gradlew --no-daemon --max-workers=2
          :app:assembleNonRootDebug :app:assembleNonRootRelease :app:assembleRootRelease
          :app:lintNonRootDebug :app:lintNonRootRelease :app:lintRootRelease
          :app:testNonRootDebugUnitTest :app:testRootDebugUnitTest
      - name: Check all native regressions with sanitizers
        run: |
          bash scripts/test-native.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightjar-debug
          path: app/build/outputs/apk/nonRoot/debug/app-nonRoot-debug.apk
          if-no-files-found: error
      - name: Emulator smoke test
        if: inputs.prerelease_tag
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          image='system-images;android-35;google_apis;x86_64'
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator platform-tools "$image" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n sunset -k "$image" -d pixel_6
          pip install --quiet pillow
          status=0
          NIGHTJAR_EMULATOR_GPU=swiftshader_indirect NIGHTJAR_BOOT_TIMEOUT=420 python3 scripts/emulator-smoke.py > smoke.out 2>&1 || status=$?
          cat smoke.out
          if [ "$status" != 0 ]; then
            tail -n 12 smoke.out | cut -c1-2000 | sed -e 's/%/%25/g' -e 's/^/::error title=smoke::/'
            grep -E 'ERROR|FATAL' app/build/emulator-smoke/emulator.log | tail -n 5
            exit 1
          fi
          NIGHTJAR_EMULATOR_GPU=swiftshader_indirect NIGHTJAR_BOOT_TIMEOUT=420 \
            python3 scripts/emulator-smoke.py --apk app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk
      - name: Build arm64 test APK
        if: inputs.prerelease_tag
        run: |
          bash gradlew --no-daemon --max-workers=2 -PabiFilters=arm64-v8a :app:assembleNonRootDebug
          cp app/build/outputs/apk/nonRoot/debug/app-nonRoot-debug.apk nightjar-arm64-debug.apk
      - name: Publish pre-release
        if: inputs.prerelease_tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.prerelease_tag }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          zip -qj smoke-screenshots.zip docs/screenshots/*.png
          gh release create "$TAG" nightjar-arm64-debug.apk smoke-screenshots.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "$TAG" \
            --notes "${NOTES:-Debug-signed arm64 test build from $GITHUB_SHA. Uninstall builds signed by another CI run first.}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.prerelease_tag
        with:
          name: nightjar-device-test
          path: |
            nightjar-arm64-debug.apk
            docs/screenshots/
            app/build/emulator-smoke/
          if-no-files-found: warn
