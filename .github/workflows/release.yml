name: Release

# A pushed v* tag builds the signed release APKs and bundle and the desktop client
# (Windows zip, Linux tar.gz) and attaches them to the GitHub release for that tag
# (created here when it does not exist yet). The desktop jobs run first and the
# release job needs them, so a tag publishes everything or nothing.
# Main's own CI (android.yml) already tested the commit: tag a commit whose
# main run is green. The signing key and passwords are repository secrets,
# see "Releasing from CI" in docs/building.md.
#
# Run it by hand with dry_run (the default) to build and verify without
# publishing; this is the first step before a real tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -e -o pipefail

jobs:
  preflight:
    # Seconds, not an hour: a tag that does not match versionName fails here, before the
    # desktop builds start. The release job checks it again next to the signing steps.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: app/build.gradle
          sparse-checkout-cone-mode: false
      - name: Check the tag against the app version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no versionName in app/build.gradle"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName \"$version\" in app/build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  desktop-linux:
    # The Linux desktop client: protocol/desktop/package-linux.sh builds it (SDL3 from
    # source, linked statically; the decode-only FFmpeg of protocol/desktop/ffmpeg-decode-only.sh,
    # shipped in lib/ so the machine's own FFmpeg does not matter) and packs
    # nightjar-desktop-<version>-linux-x86_64.tar.gz.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      # The Rubylight commit whose rust/codec-patches/pyrowave and rust/tools/build_pyrowave.sh
      # the PyroWave SDK build reads (patch 0002); a bump is a deliberate commit here.
      RUBYLIGHT_SHA: 957ace5a9cdb14b5f39cffbe662f0df1dcb41caf
      FFMPEG_VERSION: 8.1.2
      FFMPEG_SHA256: 464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # patch 0002 and the Windows build script live in the public Rubylight repo; the SDK build
      # (scripts/build-pyrowave-sdk.*, protocol/desktop/pyrowave-sdk.pin) needs only those files.
      - name: Rubylight host files for the PyroWave SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RamazanKara/Rubylight
          ref: ${{ env.RUBYLIGHT_SHA }}
          path: rubylight-host
          sparse-checkout: |
            rust/tools/build_pyrowave.sh
            rust/codec-patches/pyrowave
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install the build packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build pkg-config libclang-dev \
            nasm libdav1d-dev libopus-dev libva-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl-dev libgl-dev libgles-dev libdrm-dev libgbm-dev libpulse-dev \
            libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libdecor-0-dev \
            libvulkan-dev
      # Dry runs on main use and save the build caches. A tag run (the release itself) neither
      # restores nor saves the target, FFmpeg or SDK caches: it rebuilds them, so nothing a
      # branch run cached can end up in a published package. Only the downloaded crates
      # (~/.cargo/registry, checked by Cargo.lock) are restored.
      # The cached FFmpeg and its dav1d are linked against this image's libraries (glibc, libva).
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Decode-only FFmpeg cache
        id: ffmpeg-cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffprefix
          key: ffmpeg-decode-only-linux-${{ steps.image.outputs.os }}-${{ env.FFMPEG_VERSION }}-${{ env.FFMPEG_SHA256 }}-${{ hashFiles('protocol/desktop/ffmpeg-decode-only.sh') }}
      - name: Build the decode-only FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSLf --retry 5 --retry-all-errors -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          tar -xf ffmpeg.tar.xz
          bash protocol/desktop/ffmpeg-decode-only.sh "$PWD/ffmpeg-$FFMPEG_VERSION" "$PWD/ffprefix"
      - name: Check the FFmpeg source note
        run: |
          grep -qx "SHA-256: $FFMPEG_SHA256" ffprefix/licenses-ffmpeg/SOURCE.txt || { echo "::error::ffprefix/licenses-ffmpeg/SOURCE.txt has no SHA-256 $FFMPEG_SHA256"; exit 1; }
      - name: PyroWave SDK cache
        id: sdk-cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pyrowave-sdk/libpyrowave-shared.so
            pyrowave-sdk/build-info.txt
            pyrowave-sdk/licenses
          key: pyrowave-sdk-linux-${{ env.RUBYLIGHT_SHA }}-${{ hashFiles('protocol/desktop/pyrowave-sdk.pin', 'scripts/build-pyrowave-sdk.sh', 'app/src/main/jni/pyrowave-renderer/patches/*.patch') }}
      - name: Build the PyroWave SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-pyrowave-sdk.sh -o "$GITHUB_WORKSPACE/pyrowave-sdk" -H "$GITHUB_WORKSPACE/rubylight-host"
      - name: Rust version
        id: rustc
        run: echo "version=$(rustc -V | tr ' ()' '---')" >> "$GITHUB_OUTPUT"
      - name: Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-linux-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: cargo-registry-linux-
      - name: Cargo target cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: protocol/target
          key: desktop-linux-${{ steps.rustc.outputs.version }}-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: desktop-linux-${{ steps.rustc.outputs.version }}-
      # package-linux.sh checks the SDK against the pin, then runs the unpacked archive as
      # `nightjar --check-pyrowave`: the library must load (a runner has no Vulkan device). It also
      # fails when the unpacked executable loads an FFmpeg library from outside the archive.
      - name: Build and package
        run: bash protocol/desktop/package-linux.sh -f "$GITHUB_WORKSPACE/ffprefix" -s "$GITHUB_WORKSPACE/pyrowave-sdk" -v "$VERSION" -o "$GITHUB_WORKSPACE/dist"
      - name: Check the package
        run: |
          name="nightjar-desktop-$VERSION-linux-x86_64"
          tar -tzf "dist/$name.tar.gz" | tee contents.txt
          for file in nightjar README.md LINUX-RUNTIME.txt libpyrowave-shared.so pyrowave-sdk-build-info.txt licenses-pyrowave/LICENSE \
              licenses-ffmpeg/COPYING.LGPLv2.1 licenses-ffmpeg/SOURCE.txt licenses-dav1d/COPYING; do
            grep -qx "$name/$file" contents.txt || { echo "::error::$name.tar.gz has no $file"; exit 1; }
          done
          # The versioned names (libavcodec.so.62...) vary with the FFmpeg version: match the prefix.
          for file in lib/libavcodec.so lib/libavutil.so lib/libdav1d.so; do
            grep -Eq "^$name/$file\." contents.txt || { echo "::error::$name.tar.gz has no $file"; exit 1; }
          done
          # No FFmpeg library may resolve outside the unpacked archive, and none may be missing.
          mkdir unpacked && tar -C unpacked -xzf "dist/$name.tar.gz"
          ldd "unpacked/$name/nightjar" | tee ldd.txt
          ! grep 'not found' ldd.txt || { echo "::error::nightjar has libraries that are not found"; exit 1; }
          for lib in libavcodec libavformat libavutil libswscale libswresample libdav1d; do
            ! grep -E "^[[:space:]]*$lib\.so" ldd.txt | grep -v " => $PWD/unpacked/$name/lib/" | grep . || { echo "::error::$lib resolves outside the package"; exit 1; }
          done
          grep -Eq "libavcodec\.so.* => $PWD/unpacked/$name/lib/" ldd.txt || { echo "::error::libavcodec is not the packaged one"; exit 1; }
          tar -xzOf "dist/$name.tar.gz" "$name/LINUX-RUNTIME.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  desktop-windows:
    # The Windows desktop client: GNU toolchain, SDL3 and Opus from MSYS2, and the
    # decode-only FFmpeg (protocol/desktop/ffmpeg-decode-only.sh), so the zip holds a few
    # DLLs instead of MSYS2's 80. package-windows.ps1 walks the import tables, fails when a
    # non-system DLL would be missing from the zip, and starts the unpacked exe once.
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      # The Rubylight commit whose rust/codec-patches/pyrowave and rust/tools/build_pyrowave.sh
      # the PyroWave SDK build reads (patch 0002); a bump is a deliberate commit here.
      RUBYLIGHT_SHA: 957ace5a9cdb14b5f39cffbe662f0df1dcb41caf
      FFMPEG_VERSION: 8.1.2
      FFMPEG_SHA256: 464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c
    steps:
      # Check out with LF endings: the PyroWave patches are compared byte for byte with the
      # host's copies and applied with git, and the runner's Git defaults to autocrlf=true.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # patch 0002 and the Windows build script live in the public Rubylight repo; the SDK build
      # (scripts/build-pyrowave-sdk.*, protocol/desktop/pyrowave-sdk.pin) needs only those files.
      - name: Rubylight host files for the PyroWave SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: RamazanKara/Rubylight
          ref: ${{ env.RUBYLIGHT_SHA }}
          path: rubylight-host
          sparse-checkout: |
            rust/tools/build_pyrowave.sh
            rust/codec-patches/pyrowave
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Rust GNU toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      - name: MSYS2 packages
        # The runner image's own MSYS2: package-windows.ps1 looks in C:\msys64\ucrt64\bin.
        # A full upgrade (never -Sy alone, which mixes new package lists with old libraries);
        # the first run can stop after updating pacman itself, so it runs twice.
        run: |
          /c/msys64/usr/bin/pacman.exe -Syu --noconfirm
          /c/msys64/usr/bin/pacman.exe -Syu --noconfirm --needed make git \
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf \
            mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-opus mingw-w64-ucrt-x86_64-dav1d \
            mingw-w64-ucrt-x86_64-winpthreads
      # Dry runs on main use and save the build caches. A tag run (the release itself) neither
      # restores nor saves the target, FFmpeg or SDK caches: it rebuilds them, so nothing a
      # branch run cached can end up in a published package. Only the downloaded crates
      # (~/.cargo/registry, checked by Cargo.lock) are restored.
      - name: Decode-only FFmpeg cache
        id: ffmpeg-cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffprefix
          key: ffmpeg-decode-only-${{ env.FFMPEG_VERSION }}-${{ env.FFMPEG_SHA256 }}-${{ hashFiles('protocol/desktop/ffmpeg-decode-only.sh') }}
      - name: Build the decode-only FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSLf --retry 5 --retry-all-errors -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          tar -xf ffmpeg.tar.xz
          # The script needs an MSYS2 UCRT64 shell; a login shell sets its PATH up.
          # Git Bash does not hand its environment to MSYS2's runtime: set it with MSYS2's own env
          # (FFMPEG_SHA256 too, for licenses-ffmpeg/SOURCE.txt), and pass the workspace as an
          # argument, or the login shell starts in its home directory.
          /c/msys64/usr/bin/env.exe MSYSTEM=UCRT64 CHERE_INVOKING=1 FFMPEG_SHA256="$FFMPEG_SHA256" /c/msys64/usr/bin/bash.exe -l -c \
            'cd "$(cygpath -u "$1")" && bash protocol/desktop/ffmpeg-decode-only.sh "$PWD/ffmpeg-$2" "$PWD/ffprefix"' \
            _ "$(cygpath -w "$PWD")" "$FFMPEG_VERSION"
      # A cached prefix from before the hash reached the script would ship a source note without it.
      - name: Check the FFmpeg source note
        shell: bash
        run: |
          grep -qx "SHA-256: $FFMPEG_SHA256" ffprefix/licenses-ffmpeg/SOURCE.txt || { echo "::error::ffprefix/licenses-ffmpeg/SOURCE.txt has no SHA-256 $FFMPEG_SHA256"; exit 1; }
      - name: PyroWave SDK cache
        id: sdk-cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pyrowave-sdk/libpyrowave-shared-1.dll
            pyrowave-sdk/build-info.txt
            pyrowave-sdk/licenses
          key: pyrowave-sdk-windows-${{ env.RUBYLIGHT_SHA }}-${{ hashFiles('protocol/desktop/pyrowave-sdk.pin', 'scripts/build-pyrowave-sdk.ps1', 'app/src/main/jni/pyrowave-renderer/patches/*.patch') }}
      - name: Build the PyroWave SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: >
          ./scripts/build-pyrowave-sdk.ps1
          -Out "$env:GITHUB_WORKSPACE\pyrowave-sdk"
          -HostRepo "$env:GITHUB_WORKSPACE\rubylight-host"
      - name: Rust version
        id: rustc
        run: echo "version=$(rustc -V | tr ' ()' '---')" >> "$GITHUB_OUTPUT"
      - name: Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-windows-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: cargo-registry-windows-
      - name: Cargo target cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: protocol/target
          key: desktop-windows-${{ steps.rustc.outputs.version }}-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: desktop-windows-${{ steps.rustc.outputs.version }}-
      # package-windows.ps1 checks the SDK against the pin, adds its DLL to the import walk, and
      # runs the unpacked exe as `nightjar.exe --check-pyrowave` with only the Windows folders on
      # PATH: the DLL must load (a runner has no GPU, so building a decoder is not required).
      - name: Build, package and start the exe
        shell: pwsh
        run: >
          ./protocol/desktop/package-windows.ps1
          -FfmpegDir "$env:GITHUB_WORKSPACE\ffprefix"
          -PyrowaveSdkDir "$env:GITHUB_WORKSPACE\pyrowave-sdk"
          -Out "$env:GITHUB_WORKSPACE\dist"
          -TargetDirectory "$env:GITHUB_WORKSPACE\protocol\target"
          -Version $env:VERSION
      - name: Check the package
        run: |
          zip="dist/nightjar-desktop-$VERSION-windows-x86_64.zip"
          test -f "$zip" || { echo "::error::$zip was not built"; exit 1; }
          unzip -l "$zip"
          for file in nightjar.exe libpyrowave-shared-1.dll pyrowave-sdk-build-info.txt; do
            unzip -Z1 "$zip" | grep -qx "$file" || { echo "::error::$zip has no $file"; exit 1; }
          done
          # FFmpeg's and dav1d's licences (Compress-Archive may write the folder separator as \).
          for file in licenses-ffmpeg/COPYING.LGPLv2.1 licenses-ffmpeg/SOURCE.txt licenses-dav1d/COPYING; do
            unzip -Z1 "$zip" | grep -Eqx "${file%%/*}[/\\]${file#*/}" || { echo "::error::$zip has no $file"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # uploads to the release for this tag
    env:
      # The SHA-256 of the Nightjar release certificate (public). Updates only
      # work with this signing identity, so a build signed by anything else
      # must never be published.
      EXPECTED_CERT_SHA256: 312ed322c7c29d1aec4fae4a3979ebcb557af44d821d7f4746c0968548eb630b
      # Only a tag push (or a manual run on a tag with dry_run off) publishes.
      PUBLISH: ${{ github.ref_type == 'tag' && !inputs.dry_run }}
    steps:
      - name: Check the signing secrets
        env:
          NIGHTJAR_KEYSTORE_B64: ${{ secrets.NIGHTJAR_KEYSTORE_B64 }}
          NIGHTJAR_KEYSTORE_PASSWORD: ${{ secrets.NIGHTJAR_KEYSTORE_PASSWORD }}
          NIGHTJAR_KEY_ALIAS: ${{ secrets.NIGHTJAR_KEY_ALIAS }}
          NIGHTJAR_KEY_PASSWORD: ${{ secrets.NIGHTJAR_KEY_PASSWORD }}
        run: |
          missing=
          for name in NIGHTJAR_KEYSTORE_B64 NIGHTJAR_KEYSTORE_PASSWORD NIGHTJAR_KEY_ALIAS NIGHTJAR_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions (docs/building.md, Releasing from CI), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check the tag against the app version
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no versionName in app/build.gradle"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName \"$version\" in app/build.gradle"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Decode the keystore
        env:
          NIGHTJAR_KEYSTORE_B64: ${{ secrets.NIGHTJAR_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$NIGHTJAR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nightjar-release.keystore"
      - name: Build the signed release
        # app/build.gradle reads these four (BP_*) variables and fails the
        # release build when any is missing; it never falls back to the debug key.
        env:
          BP_KEYSTORE: ${{ runner.temp }}/nightjar-release.keystore
          BP_KEYSTORE_PASSWORD: ${{ secrets.NIGHTJAR_KEYSTORE_PASSWORD }}
          BP_KEY_ALIAS: ${{ secrets.NIGHTJAR_KEY_ALIAS }}
          BP_KEY_PASSWORD: ${{ secrets.NIGHTJAR_KEY_PASSWORD }}
        run: bash gradlew --no-daemon --max-workers=2 :app:assembleNonRootRelease :app:assembleRootRelease :app:bundleNonRootRelease
      - name: Verify the signature and the app IDs
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          # apksigner prints "Signer #1 certificate SHA-256 digest: <hex>" or, on
          # the runner, "V2 Signer: certificate SHA-256 digest: <hex>" (one line
          # per scheme: V2, V3, V3.1). Reduce them to the distinct digests; the
          # result must be exactly the expected one, so no line at all fails too.
          digests_of() { sed -n 's/^.*certificate SHA-256 digest: *//p' | tr -d '\r' | tr 'A-F' 'a-f' | sort -u; }
          check() { # apk, application ID
            "$apksigner" verify --print-certs "$1" | tee certs.txt | { grep -i 'certificate SHA-256' || true; }
            digests=$(digests_of < certs.txt)
            if [ "$digests" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$1 is signed by '$digests', not by the Nightjar release certificate"
              echo "::error::$1 is not signed by the Nightjar release certificate"
              exit 1
            fi
            package=$("$aapt2" dump packagename "$1")
            if [ "$package" != "$2" ]; then
              echo "::error::the application ID of $1 is $package, not $2"
              exit 1
            fi
          }
          check app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk com.butterpollo.client
          check app/build/outputs/apk/root/release/app-root-release.apk com.butterpollo.client.root
          # The bundle is signed like a jar. aapt2 cannot read its application ID;
          # it comes from the same nonRoot variant as the checked APK.
          bundle=app/build/outputs/bundle/nonRootRelease/app-nonRoot-release.aab
          # keytool prints "<tab> SHA256: AA:BB:..." under "Certificate fingerprints:".
          keytool -printcert -jarfile "$bundle" | tee certs.txt | { grep -E 'SHA256: ' || true; }
          fingerprints=$(sed -n 's/^[[:space:]]*SHA256: *//p' certs.txt | tr -d ':\r' | tr 'A-F' 'a-f' | sort -u)
          if [ "$fingerprints" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::$bundle is signed by '$fingerprints', not by the Nightjar release certificate"
            exit 1
          fi
      # Nothing after the build needs the key.
      - name: Remove the keystore
        run: rm -f "$RUNNER_TEMP/nightjar-release.keystore"
      - name: Fetch the desktop packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: desktop
          merge-multiple: true
      - name: Check the desktop packages
        run: |
          for file in "desktop/nightjar-desktop-$VERSION-linux-x86_64.tar.gz" "desktop/nightjar-desktop-$VERSION-windows-x86_64.zip"; do
            test -s "$file" || { echo "::error::$file is missing from the desktop artifacts"; exit 1; }
          done
          ls -l desktop
      - name: Publish to the release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir out
          cp desktop/nightjar-desktop-* out/
          cp app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk "out/nightjar-$VERSION.apk"
          # Same APK under a fixed name, so .../releases/latest/download/nightjar.apk always serves
          # the newest release (the TV install link in the README and the Downloader code use it).
          cp app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk out/nightjar.apk
          cp app/build/outputs/apk/root/release/app-root-release.apk "out/nightjar-$VERSION-root.apk"
          cp app/build/outputs/bundle/nonRootRelease/app-nonRoot-release.aab "out/nightjar-$VERSION.aab"
          # R8 map and native symbols of the non-root build, for reading this release's crash traces.
          cp app/build/outputs/mapping/nonRootRelease/mapping.txt "out/nightjar-$VERSION-mapping.txt"
          cp app/build/outputs/native-debug-symbols/nonRootRelease/native-debug-symbols.zip "out/nightjar-$VERSION-native-debug-symbols.zip"
          (cd out && sha256sum nightjar-* nightjar.apk >"SHA256SUMS-$VERSION.txt")
          flags=()
          if [[ $VERSION == *-* ]]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # CI replaces assets only on a draft; a published release keeps what it has.
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ]; then
              clobber=(--clobber)
            else
              clobber=()
              existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
              for file in out/*; do
                if grep -qxF "$(basename "$file")" <<< "$existing"; then
                  echo "::error::$GITHUB_REF_NAME is published and already has $(basename "$file"). CI replaces assets only on a draft release: make it a draft first, or delete that asset by hand."
                  exit 1
                fi
              done
            fi
            gh release upload "$GITHUB_REF_NAME" out/* "${clobber[@]}"
            if [ "${#flags[@]}" != 0 ]; then gh release edit "$GITHUB_REF_NAME" "${flags[@]}"; fi
          else
            gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "Nightjar $VERSION" \
              --notes "The APKs are signed by CI with the Nightjar release key; the desktop packages (Windows zip, Linux tar.gz) are not signed. SHA-256 hashes of everything are in SHA256SUMS-$VERSION.txt." "${flags[@]}"
          fi
          echo "::notice::published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
      - name: Dry run result
        if: ${{ env.PUBLISH != 'true' }}
        run: echo "::notice::dry run of $VERSION built and verified (APKs, bundle, desktop client); nothing was published"
      # Fallback: the keystore is already gone after the build unless a step failed.
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nightjar-release.keystore"
