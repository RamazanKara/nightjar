apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigning = [
        storeFile: System.getenv('BP_KEYSTORE') ?: keystoreProperties.getProperty('storeFile'),
        storePassword: System.getenv('BP_KEYSTORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword'),
        keyAlias: System.getenv('BP_KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias'),
        keyPassword: System.getenv('BP_KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')
]
def hasReleaseSigning = releaseSigning.values().any { it }
if (hasReleaseSigning && !releaseSigning.values().every { it }) {
    throw new GradleException('Incomplete release signing: set all four BP_KEYSTORE/BP_KEYSTORE_PASSWORD/BP_KEY_ALIAS/BP_KEY_PASSWORD variables or keystore.properties entries.')
}
def brandName = project.property('brandName').toString()

// The task timeout says only that the task took too long. A test still running after 3 minutes,
// or 3 minutes without any test running, names itself here with the test JVMs' threads.
def watchForHungTests(Test task) {
    long limitNs = 3L * 60 * 1_000_000_000L
    def running = new java.util.concurrent.ConcurrentHashMap<String, Long>()
    def reported = java.util.concurrent.ConcurrentHashMap.newKeySet()
    def lastEventNs = new java.util.concurrent.atomic.AtomicLong()
    task.beforeTest { d -> running.put("${d.className} > ${d.name}".toString(), System.nanoTime()); lastEventNs.set(System.nanoTime()) }
    task.afterTest { d, r -> running.remove("${d.className} > ${d.name}".toString()); lastEventNs.set(System.nanoTime()) }
    def dumpTestJvms = {
        def jcmd = new File(System.getProperty('java.home'), 'bin/jcmd' + (System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''))
        if (!jcmd.exists()) { task.logger.lifecycle("No thread dump: ${jcmd} is missing"); return }
        def run = { List<String> args ->
            def p = new ProcessBuilder([jcmd.path] + args).redirectErrorStream(true).start()
            def out = p.inputStream.getText('UTF-8')
            p.waitFor()
            out
        }
        run(['-l']).readLines().findAll { it.contains('Gradle Test Executor') }.each { line ->
            task.logger.lifecycle("Threads of ${line}:\n" + run([line.tokenize()[0], 'Thread.print']))
        }
    }
    task.doFirst {
        lastEventNs.set(System.nanoTime())
        def watchdog = new Timer("${task.name} watchdog", true)
        watchdog.schedule(new TimerTask() {
            void run() {
                if (task.state.executed) { watchdog.cancel(); return }
                try {
                    long now = System.nanoTime()
                    def hung = running.findAll { name, startNs -> now - startNs > limitNs && reported.add(name) }
                    boolean idle = running.isEmpty() && now - lastEventNs.get() > limitNs && reported.add(lastEventNs.get())
                    if (!hung && !idle) return
                    hung.each { name, startNs -> task.logger.lifecycle("HUNG TEST: ${name} has run for ${(now - startNs).intdiv(1_000_000_000L)} s") }
                    if (idle) task.logger.lifecycle("HUNG TEST: no test has run for ${(now - lastEventNs.get()).intdiv(1_000_000_000L)} s")
                    dumpTestJvms()
                } catch (Exception e) {
                    // An exception would end the timer's thread without a word.
                    task.logger.lifecycle("Unit test watchdog failed: ${e}")
                }
            }
        }, 30_000L, 30_000L)
    }
}

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 36

        versionName "4.0.0-alpha.2"
        versionCode = 359

        resValue "string", "app_name", brandName
        buildConfigField "String", "BRAND_NAME", "\"${brandName}\""
        // Builds for a store that updates the app itself (-PgithubUpdates=false) hide the in-app updater.
        buildConfigField "boolean", "GITHUB_UPDATES", project.findProperty('githubUpdates') == 'false' ? 'false' : 'true'

        externalNativeBuild {
            ndkBuild {
                arguments "-j2"
            }
        }

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'

        // -PabiFilters=arm64-v8a builds a smaller single-ABI APK for device testing
        if (project.hasProperty('abiFilters')) {
            ndk.abiFilters.addAll(project.property('abiFilters').toString().split(',') as List)
        }
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.butterpollo.client.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "com.butterpollo.client"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    androidResources {
        localeFilters += ['en', 'de', 'es', 'fr', 'it', 'ja', 'ko', 'pl', 'pt-rBR', 'ru', 'tr', 'uk', 'vi', 'zh-rCN', 'zh-rTW']
    }

    lint {
        enable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxParallelForks = 2
            // Robolectric keeps every locale's resource table in memory.
            maxHeapSize = '1g'
            // The suite takes about 5 minutes; a test that hangs fails the task here instead of
            // running into CI's 60-minute job limit.
            timeout = java.time.Duration.ofMinutes(20)
            watchForHungTests(it)
        }
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            // -PdebugIdSuffix=.n5 installs a side-by-side debug copy; the default stays ".debug".
            applicationIdSuffix project.findProperty("debugIdSuffix") ?: ".debug"
            resValue "string", "app_label", "${brandName} (Debug)"
            resValue "string", "app_label_root", "${brandName} (Root Debug)"
        }
        release {
            resValue "string", "app_label", brandName
            resValue "string", "app_label_root", "${brandName} (Root)"

            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

// Resolved here: the configuration cache allows no Project access while tasks run.
def releaseStoreFile = hasReleaseSigning ? rootProject.file(releaseSigning.storeFile) : null
def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is required: configure keystore.properties or BP_KEYSTORE/BP_KEYSTORE_PASSWORD/BP_KEY_ALIAS/BP_KEY_PASSWORD.')
        }
        def keyStore = java.security.KeyStore.getInstance(releaseStoreFile, releaseSigning.storePassword.toCharArray())
        def certificate = keyStore.getCertificate(releaseSigning.keyAlias)
        if (certificate == null || certificate.subjectX500Principal.name.contains('CN=Android Debug')) {
            throw new GradleException('Release signing requires a dedicated release key, not the Android debug key.')
        }
    }
}

// The patches only touch moonlight-common-c/src. When the set of patches changes (or the stamp is
// missing), src is reset to the pinned commit and every patch is applied again in order, so an
// edited patch never meets a tree that still carries its old version. scripts/test-native.sh uses
// the same list and stamp. Change the patches, not the submodule: local edits to src are discarded.
def nativePatchNames = ['bughunt-stream.patch', 'bughunt-input.patch', 'controller-haptics.patch', 'host-termination.patch',
                        'disconnect-intercept.patch', 'control-payload.patch', 'control-teardown.patch', 'host-timing.patch',
                        'network-grace.patch', 'cursor-shape.patch', 'network-grace-input.patch',
                        'pyrowave-link-hints.patch', 'video-recv-buffer.patch', 'clock-sync.patch', 'prefix-sei.patch',
                        'fec-report.patch', 'surround-714.patch']

// A typed task so the configuration cache can store it: the patches and their order are its
// inputs, the stamp its output, and it reaches git through ExecOperations, not the Project.
abstract class PrepareNativePatches extends DefaultTask {
    @Input
    abstract ListProperty<String> getPatchNames()

    @InputFiles @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getPatches()

    @Internal
    abstract DirectoryProperty getCommonDir()

    @OutputFile
    abstract RegularFileProperty getStampFile()

    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @TaskAction
    void patch() {
        def common = commonDir.get().asFile
        if (!new File(common, 'src/Limelight.h').exists()) {
            throw new GradleException('moonlight-common-c is not checked out. Run: git submodule update --init --recursive')
        }
        def patchFiles = patches.files.toList()
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        patchFiles.each { digest.update(it.bytes) }
        def stamp = digest.digest().encodeHex().toString()
        def stamped = stampFile.get().asFile
        if (stamped.exists() && stamped.text.trim() == stamp) {
            return
        }

        def reset = runGit(common, ['checkout', '--', 'src'])
        if (reset[0] != 0) {
            throw new GradleException("Could not reset moonlight-common-c/src before patching: ${reset[1]}")
        }
        patchFiles.each { patch ->
            def applied = runGit(common, ['apply', patch.absolutePath])
            if (applied[0] != 0) {
                throw new GradleException("Native patch ${patch.name} does not apply: ${applied[1]}")
            }
        }
        stamped.parentFile.mkdirs()
        stamped.text = stamp + '\n'
    }

    // Not private: closures in the subclass Gradle generates cannot call private methods.
    List runGit(File directory, List<String> arguments) {
        def errors = new ByteArrayOutputStream()
        def result = execOperations.exec {
            workingDir directory
            commandLine(['git'] + arguments)
            errorOutput = errors
            ignoreExitValue = true
        }
        [result.exitValue, errors.toString()]
    }
}

def prepareNativePatches = tasks.register('prepareNativePatches', PrepareNativePatches) {
    def core = file('src/main/jni/moonlight-core')
    patchNames.set(nativePatchNames)
    patches.from(nativePatchNames.collect { new File(core, "patches/$it") })
    commonDir.set(new File(core, 'moonlight-common-c'))
    stampFile.set(layout.buildDirectory.file('native-patches.stamp'))
}

tasks.configureEach { task ->
    if (task.name ==~ /pre.*ReleaseBuild/) {
        task.dependsOn verifyReleaseSigning
    }
    if (task.name == 'preBuild' || task.name.startsWith('configureNdkBuild') || task.name.startsWith('buildNdkBuild')) {
        task.dependsOn prepareNativePatches
    }
}

// The Rust streaming engine (protocol/android, behind the "New streaming engine" setting):
// libnightjar_core.so per ABI, built by cargo with the NDK's clang as compiler and linker and
// packaged like jniLibs. It is not committed: it is a few MB per ABI and changes with every
// engine change. Needs rustup with the four Android targets (see protocol/README.md).
// Cacheable: the inputs are the sources, the pinned toolchain, the ABIs and the NDK, so another
// checkout with the same engine takes the libraries from the build cache.
@CacheableTask
abstract class CargoAndroidBuild extends DefaultTask {
    static final Map<String, List<String>> TARGETS = [
            'arm64-v8a'  : ['aarch64-linux-android', 'aarch64-linux-android21'],
            'armeabi-v7a': ['armv7-linux-androideabi', 'armv7a-linux-androideabi21'],
            'x86'        : ['i686-linux-android', 'i686-linux-android21'],
            'x86_64'     : ['x86_64-linux-android', 'x86_64-linux-android21'],
    ]

    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getSources()

    @Input
    abstract ListProperty<String> getAbis()

    @Input
    abstract Property<String> getNdkPath()

    @Internal
    abstract DirectoryProperty getProtocolDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @TaskAction
    void build() {
        def windows = System.getProperty('os.name').toLowerCase().contains('windows')
        def host = windows ? 'windows-x86_64' :
                System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin-x86_64' : 'linux-x86_64'
        def bin = new File(ndkPath.get(), "toolchains/llvm/prebuilt/$host/bin")
        def clang = new File(bin, windows ? 'clang.exe' : 'clang').absolutePath
        def ar = new File(bin, windows ? 'llvm-ar.exe' : 'llvm-ar').absolutePath
        def cargo = System.getenv('CARGO') ?: 'cargo'
        def homeCargo = new File(System.getProperty('user.home'), ".cargo/bin/${windows ? 'cargo.exe' : 'cargo'}")
        if (!System.getenv('CARGO') && homeCargo.exists()) cargo = homeCargo.absolutePath
        def protocol = protocolDir.get().asFile
        if (windows) checkMsys(cargo, protocol)
        def out = outputDir.get().asFile
        out.deleteDir()
        abis.get().each { abi ->
            def (triple, clangTarget) = TARGETS[abi]
            def upper = triple.toUpperCase().replace('-', '_')
            def lower = triple.replace('-', '_')
            def env = [
                    ("CARGO_TARGET_${upper}_LINKER".toString())   : clang,
                    ("CARGO_TARGET_${upper}_RUSTFLAGS".toString()): "-C link-arg=--target=$clangTarget -C link-arg=-Wl,-z,max-page-size=16384".toString(),
                    ("CC_$lower".toString())                      : clang,
                    ("CFLAGS_$lower".toString())                  : "--target=$clangTarget".toString(),
                    ("AR_$lower".toString())                      : ar,
            ]
            execOperations.exec {
                workingDir protocol
                environment env
                commandLine cargo, 'build', '--release', '--locked', '-p', 'nightjar-android', '--target', triple
            }
            def lib = new File(protocol, "target/$triple/release/libnightjar_core.so")
            checkPageAlignment(lib)
            def dir = new File(out, abi)
            dir.mkdirs()
            java.nio.file.Files.copy(lib.toPath(), new File(dir, lib.name).toPath())
        }
    }

    // On a windows-gnu host cargo links every build script with the repository's
    // .cargo/config.toml linker, "gcc" from PATH; rustup's self-contained mingw gcc is not used
    // unless CARGO_TARGET_<host>_LINKER names it. Without either cargo fails deep inside a
    // dependency's build; this names the fix up front. The C code (ring) is built with the NDK's
    // clang and nothing in the engine uses bindgen, so neither MSYS2's compiler nor libclang is
    // needed.
    void checkMsys(String cargo, File protocol) {
        def cargoDir = new File(cargo).parentFile
        def rustc = cargoDir && new File(cargoDir, 'rustc.exe').isFile() ? new File(cargoDir, 'rustc.exe').absolutePath : 'rustc'
        def version = new ByteArrayOutputStream()
        try {
            execOperations.exec {
                workingDir protocol
                commandLine rustc, '-vV'
                standardOutput = version
            }
        } catch (Exception e) {
            throw new GradleException("The Rust engine needs rustup's rustc ($rustc -vV failed: ${e.message}): install Rust with rustup, or set CARGO to its cargo.exe, then build again.", e)
        }
        def host = version.toString().readLines().find { it.startsWith('host: ') }?.substring(6)?.trim()
        if (!host?.endsWith('-gnu')) return
        def linkerVar = "CARGO_TARGET_${host.toUpperCase().replace('-', '_')}_LINKER"
        if (System.getenv(linkerVar)) return
        def path = (System.getenv('PATH') ?: '').split(File.pathSeparator).findAll { it }
        if (!path.any { new File(it, 'gcc.exe').isFile() }) {
            def selfContained = "lib\\rustlib\\$host\\bin\\self-contained\\${host.split('-')[0]}-w64-mingw32-gcc.exe"
            throw new GradleException("The Rust engine links its build scripts with gcc.exe, which is not on PATH: put C:\\msys64\\ucrt64\\bin on PATH, or set $linkerVar to the toolchain's $selfContained, then build again.")
        }
    }

    // Android 15+ devices with 16 KiB pages load only libraries whose LOAD segments are aligned
    // to at least 16 KiB.
    static void checkPageAlignment(File lib) {
        def buf = java.nio.ByteBuffer.wrap(lib.bytes).order(java.nio.ByteOrder.LITTLE_ENDIAN)
        boolean is64 = buf.get(4) == 2
        long phoff = is64 ? buf.getLong(0x20) : (buf.getInt(0x1C) & 0xFFFFFFFFL)
        int phentsize = buf.getShort(is64 ? 0x36 : 0x2A) & 0xFFFF
        int phnum = buf.getShort(is64 ? 0x38 : 0x2C) & 0xFFFF
        for (int i = 0; i < phnum; i++) {
            int at = (int) (phoff + i * phentsize)
            if (buf.getInt(at) != 1) continue // PT_LOAD
            long align = is64 ? buf.getLong(at + 0x30) : (buf.getInt(at + 0x1C) & 0xFFFFFFFFL)
            if (align < 16384) {
                throw new GradleException("$lib has a LOAD segment aligned to $align bytes; 16 KiB pages need 16384")
            }
        }
    }
}

def rustAbis = project.hasProperty('abiFilters') ?
        project.property('abiFilters').toString().split(',').collect { it.trim() }.findAll { CargoAndroidBuild.TARGETS.containsKey(it) } :
        CargoAndroidBuild.TARGETS.keySet().toList()
def buildRustEngine = tasks.register('buildRustEngine', CargoAndroidBuild) {
    def protocol = rootProject.file('protocol')
    sources.from(fileTree(protocol) {
        include '**/*.rs', '**/Cargo.toml', 'Cargo.lock'
        exclude '**/target/**'
    })
    sources.from(fileTree('src/main/jni/moonlight-core/opus') { include '*/libopus.a' })
    sources.from(rootProject.file('../rust-toolchain.toml'))
    abis.set(rustAbis)
    ndkPath.set(androidComponents.sdkComponents.ndkDirectory.map { it.asFile.absolutePath })
    protocolDir.set(protocol)
    outputDir.set(layout.buildDirectory.dir('rustJniLibs'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.jniLibs?.addGeneratedSourceDirectory(buildRustEngine) { it.outputDir }
    }
}

dependencies {
    implementation 'androidx.window:window-java:1.4.0'
    implementation 'androidx.window:window-core:1.4.0'
    implementation('com.google.android.material:material:1.13.0') {
        // OkHttp already supplies the merged Kotlin 2.2 JVM standard library.
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-common'
    }
    constraints {
        implementation 'androidx.annotation:annotation:1.9.1'
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    // Scan QR code in Add PC (Experimental). ZXing core decodes; CameraX 1.4 is the last line that runs on
    // minSdk 21 (1.5 needs 23).
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
